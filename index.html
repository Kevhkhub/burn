<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>會議焚化儀式 - v1.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* By Kevin - 基礎環境火光 */
        body {
            background: radial-gradient(circle at 50% 120%, #3a0c00 0%, #110506 50%, #000000 100%);
            background-size: 200% 200%;
            touch-action: manipulation;
            overflow: hidden; /* 防止震動時出現捲動條 */
        }

        /* 劇烈震動特效 (應用於整個畫面) */
        .screen-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-2px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 文字極端燃燒扭曲特效 */
        .extreme-burn {
            animation: extremeBurnEffect 2s ease-in forwards;
        }

        @keyframes extremeBurnEffect {
            0% {
                transform: translate(-50%, -50%) scale(1) skewX(0deg);
                color: #ffffff;
                text-shadow: 0 0 10px #fff;
                opacity: 1;
                filter: blur(0px);
            }
            10% {
                transform: translate(-50%, -50%) scale(1.2) skewX(-10deg);
                color: #ffff88;
                text-shadow: 0 0 20px #ff0, 0 0 40px #f90;
            }
            40% {
                transform: translate(-50%, -55%) scale(1.4) skewX(10deg);
                color: #ff4500;
                text-shadow: 0 -20px 40px #f00, 0 -40px 80px #800;
                filter: blur(1px);
            }
            70% {
                transform: translate(-50%, -65%) scale(1.5) skewX(-5deg) scaleY(1.5);
                color: #111;
                text-shadow: 0 -30px 50px #000;
                opacity: 0.9;
                filter: blur(4px);
            }
            100% {
                transform: translate(-50%, -100%) scale(0.5) skewX(20deg) scaleY(3);
                color: #000;
                text-shadow: 0 -50px 100px #000;
                opacity: 0;
                filter: blur(10px);
            }
        }

        /* 爆發式功德浮現 */
        .merit-pop {
            animation: meritPopEffect 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes meritPopEffect {
            0% {
                transform: translate(-50%, -20px) scale(0);
                opacity: 0;
                text-shadow: 0 0 0 rgba(255, 215, 0, 0);
            }
            20% {
                transform: translate(-50%, -80px) scale(1.5);
                opacity: 1;
                text-shadow: 0 0 50px rgba(255, 215, 0, 1), 0 0 100px rgba(255, 140, 0, 1);
            }
            40% {
                transform: translate(-50%, -80px) scale(1.2);
                opacity: 1;
                text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            }
            80% {
                transform: translate(-50%, -120px) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -180px) scale(0.8);
                opacity: 0;
                text-shadow: 0 0 10px rgba(255, 215, 0, 0);
            }
        }
    </style>
</head>
<body id="mainBody" class="min-h-screen text-white flex flex-col items-center justify-center font-sans">

    <!-- Canvas 火焰特效層 (置於背景與UI之間) -->
    <canvas id="fireCanvas" class="fixed inset-0 pointer-events-none z-10 w-full h-full"></canvas>

    <!-- 頂部標題區 -->
    <div class="absolute top-10 left-0 w-full text-center z-20 px-4">
        <h1 class="text-3xl md:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-b from-orange-400 to-red-600 drop-shadow-[0_0_10px_rgba(234,88,12,0.8)]">
            🔥會議焚化儀式🔥
        </h1>
        <p class="text-gray-400 mt-2 text-sm md:text-base font-bold">讓世間有需要灰飛煙滅的東西(感覺上)灰飛煙滅</p>
    </div>

    <!-- 互動操作區 -->
    <div class="w-11/12 max-w-md bg-black/60 backdrop-blur-md border-2 border-red-900/50 p-6 md:p-8 rounded-3xl shadow-[0_0_50px_rgba(153,27,27,0.3)] z-30 transition-all duration-300" id="controlPanel">
        <div class="flex flex-col gap-5">
            <input 
                type="text" 
                id="foodInput" 
                placeholder="輸入Project/朋友/同事的名稱..." 
                class="w-full bg-zinc-900 text-white text-xl md:text-2xl px-5 py-4 rounded-xl border-2 border-red-900/50 focus:border-red-500 focus:ring-4 focus:ring-red-500/30 outline-none transition-all placeholder-gray-600 text-center font-bold"
                autocomplete="off"
            >
            <button 
                id="incinerateBtn"
                onclick="startIncineration()"
                class="w-full bg-gradient-to-r from-red-800 via-red-600 to-orange-600 hover:from-red-700 hover:via-orange-600 hover:to-yellow-500 active:scale-95 text-white font-black text-2xl py-4 rounded-xl shadow-[0_0_20px_rgba(220,38,38,0.6)] transition-all duration-200 flex items-center justify-center gap-2 group"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-flame group-hover:animate-pulse"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
                啟動烈火焚化
            </button>
        </div>
    </div>

    <!-- HTML 文字動畫舞台 -->
    <div id="animationStage" class="fixed inset-0 pointer-events-none z-40"></div>

    <script>
        // --- Canvas 火焰粒子系統 ---
        const canvas = document.getElementById('fireCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let isEmitting = false;
        let animationId;

        // 調整 Canvas 尺寸符合視窗
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class FireParticle {
            constructor(x, y) {
                // 發射範圍涵蓋畫面中央偏下一點點
                this.x = x + (Math.random() - 0.5) * (window.innerWidth * 0.6); 
                this.y = y + (Math.random() - 0.5) * 50;
                this.vx = (Math.random() - 0.5) * 3; // 水平飄動
                this.vy = (Math.random() * -12) - 5; // 快速向上衝
                this.size = Math.random() * 40 + 20; // 粒子大小
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.015; // 衰減速度
                this.isSmoke = Math.random() > 0.8; // 部分粒子變成黑煙
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size *= 0.96; // 逐漸縮小
            }

            draw(ctx) {
                if (this.life <= 0) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                
                if (this.isSmoke) {
                    // 黑煙效果
                    ctx.fillStyle = `rgba(20, 20, 20, ${this.life * 0.5})`;
                    ctx.globalCompositeOperation = 'source-over';
                } else {
                    // 火焰顏色變化：白 -> 黃 -> 橘紅 -> 暗紅
                    let r = 255;
                    let g = Math.max(0, Math.floor(255 * (this.life - 0.3) * 1.5));
                    let b = Math.max(0, Math.floor(255 * (this.life - 0.7) * 3));
                    let a = this.life;
                    
                    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${a})`;
                    ctx.globalCompositeOperation = 'lighter'; // 讓火光疊加發亮
                }
                
                ctx.fill();
            }
        }

        function animateFire() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 如果處於噴發狀態，每幀產生大量粒子
            if (isEmitting) {
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2 + 50;
                // 每幀產生 15 個粒子，營造爆燃感
                for(let i = 0; i < 15; i++) {
                    particles.push(new FireParticle(centerX, centerY));
                }
            }

            // 更新與繪製粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 只要還有粒子或正在噴發，就繼續循環
            if (particles.length > 0 || isEmitting) {
                animationId = requestAnimationFrame(animateFire);
            }
        }

        // --- UI 互動邏輯 ---
        document.getElementById('foodInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                startIncineration();
                this.blur(); 
            }
        });

        function startIncineration() {
            const input = document.getElementById('foodInput');
            const foodName = input.value.trim();
            const btn = document.getElementById('incinerateBtn');
            const panel = document.getElementById('controlPanel');
            const body = document.getElementById('mainBody');
            const stage = document.getElementById('animationStage');

            if (!foodName) {
                panel.classList.add('animate-bounce');
                setTimeout(() => panel.classList.remove('animate-bounce'), 500);
                return;
            }

            // 準備狀態
            input.value = '';
            btn.disabled = true;
            panel.classList.add('opacity-0', 'pointer-events-none'); // 焚化時隱藏面板
            
            // 1. 啟動螢幕劇烈震動
            body.classList.add('screen-shake');

            // 2. 啟動 Canvas 爆燃特效
            isEmitting = true;
            if (!animationId || particles.length === 0) {
                animateFire();
            }

            // 3. 建立扭曲燃燒的文字
            const burnText = document.createElement('div');
            burnText.textContent = foodName;
            burnText.className = 'absolute top-1/2 left-1/2 text-6xl md:text-8xl font-black text-center w-full px-4 extreme-burn z-40 break-words';
            stage.appendChild(burnText);

            // 狂暴震動回饋 (如果手機支援)
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200, 50, 300]); 
            }

            // 4. 控制時間軸
            setTimeout(() => {
                // 1.2秒後：停止產生火焰，讓餘火飄散
                isEmitting = false;
                body.classList.remove('screen-shake'); // 停止震動
            }, 1200);

            setTimeout(() => {
                // 1.8秒後：食物燒盡，彈出爆發功德
                if(stage.contains(burnText)) stage.removeChild(burnText);

                const meritText = document.createElement('div');
                meritText.innerHTML = '✨ 功德 +1 ✨';
                meritText.className = 'absolute top-1/2 left-1/2 text-5xl md:text-7xl font-black text-yellow-300 merit-pop z-50 whitespace-nowrap';
                stage.appendChild(meritText);

                if (navigator.vibrate) {
                    navigator.vibrate(400); // 功德長震動
                }

                // 4.5秒後：完全重置，讓使用者可以再次輸入
                setTimeout(() => {
                    if(stage.contains(meritText)) stage.removeChild(meritText);
                    btn.disabled = false;
                    panel.classList.remove('opacity-0', 'pointer-events-none');
                    // 取消 focus 以免在手機上一直彈出鍵盤，讓畫面保持乾淨
                }, 2500);

            }, 1800);
        }
    </script>
</body>
</html>
